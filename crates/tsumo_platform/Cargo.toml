[package]
name = "tsumo-platform"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
html-escape = "0.2.13"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
linkify = "0.11.0"
pulldown-cmark = "0.13.0"
regex = "1.11.2"
tempfile = "3.20.0"
tsonic_rust_runtime = { path = "../../../rust-runtime/crates/tsonic_rust_runtime" }
